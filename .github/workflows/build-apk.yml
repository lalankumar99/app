name: Build Android APK (Coaching App Template)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub से मैन्युअली 1-क्लिक में APK बनाने का बटन देता है

jobs:
  build-android-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Generate Android & Windows Platform Folders (if not present)
        run: |
          flutter create --platforms=android,windows --project-name coaching_app_template .

      - name: 5. Install Flutter Dependencies
        run: flutter pub get

      - name: 6. Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Upload Ready APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Coaching-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
